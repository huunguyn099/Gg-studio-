name: Build Gemini 3.7 Native APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Dọn dẹp và Nạp mã nguồn Gemini 3.7 Bất Tử
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          flutter create --org com.gemini.ai --project-name gemini_app .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter pub add http

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;

          class ChatMessage {
            final String text;
            final bool isUser;
            ChatMessage({required this.text, required this.isUser});
            Map<String, dynamic> toJson() => {'text': text, 'isUser': isUser};
            factory ChatMessage.fromJson(Map<String, dynamic> j) =>
                ChatMessage(text: j['text'], isUser: j['isUser']);
          }

          class ChatSession {
            String title;
            List<ChatMessage> messages;
            ChatSession({required this.title, required this.messages});
            Map<String, dynamic> toJson() => {
                  'title': title,
                  'messages': messages.map((m) => m.toJson()).toList(),
                };
            factory ChatSession.fromJson(Map<String, dynamic> j) => ChatSession(
                  title: j['title'],
                  messages: (j['messages'] as List)
                      .map((m) => ChatMessage.fromJson(m))
                      .toList(),
                );
          }

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(statusBarColor: Colors.transparent),
            );
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: GeminiMainScreen(),
            ));
          }

          class GeminiMainScreen extends StatefulWidget {
            const GeminiMainScreen({super.key});
            @override
            State<GeminiMainScreen> createState() => _GeminiMainScreenState();
          }

          class _GeminiMainScreenState extends State<GeminiMainScreen> {
            final TextEditingController _textCtrl = TextEditingController();
            final ScrollController _scrollCtrl = ScrollController();

            String _apiKey = '';
            int _gradientIdx = 0;
            bool _isLoading = false;
            String _loadingStatus = "Gemini 3.7 đang suy nghĩ...";
            int _currentSessionIdx = 0;
            List<ChatSession> _sessions = [
              ChatSession(title: "Đoạn chat mới", messages: [])
            ];

            final List<List<Color>> _gradients = [
              [const Color(0xFF0F172A), const Color(0xFF1E1B4B), const Color(0xFF311042)],
              [const Color(0xFF090A0F), const Color(0xFF180E29), const Color(0xFF003049)],
              [const Color(0xFF021B1A), const Color(0xFF06302B), const Color(0xFF00120B)],
              [const Color(0xFF1A0A0A), const Color(0xFF2E0818), const Color(0xFF0F050E)],
              [const Color(0xFF000000), const Color(0xFF111827), const Color(0xFF1F2937)],
            ];

            @override
            void initState() {
              super.initState();
              _loadData();
            }

            Future<File> _getLocalFile() async {
              final dir = Directory.systemTemp;
              return File('${dir.path}/gemini_data.json');
            }

            void _loadData() async {
              try {
                final file = await _getLocalFile();
                if (await file.exists()) {
                  final data = jsonDecode(await file.readAsString());
                  setState(() {
                    _apiKey = data['api_key'] ?? '';
                    _gradientIdx = data['gradient_idx'] ?? 0;
                    if (data['sessions'] != null) {
                      _sessions = (data['sessions'] as List)
                          .map((s) => ChatSession.fromJson(s))
                          .toList();
                    }
                  });
                }
              } catch (_) {}
            }

            void _saveData() async {
              try {
                final file = await _getLocalFile();
                final data = {
                  'api_key': _apiKey,
                  'gradient_idx': _gradientIdx,
                  'sessions': _sessions.map((s) => s.toJson()).toList(),
                };
                await file.writeAsString(jsonEncode(data));
              } catch (_) {}
            }

            // HÀM GỌI API THÔNG MINH (AUTO-RETRY & FALLBACK BẤT TỬ)
            void _sendMessage() async {
              final text = _textCtrl.text.trim();
              if (text.isEmpty) return;

              if (_apiKey.isEmpty) {
                _showApiKeyDialog();
                return;
              }

              _textCtrl.clear();
              final currentSession = _sessions[_currentSessionIdx];

              setState(() {
                currentSession.messages.add(ChatMessage(text: text, isUser: true));
                if (currentSession.messages.length == 1) {
                  currentSession.title = text.length > 22 ? "${text.substring(0, 22)}..." : text;
                }
                _isLoading = true;
                _loadingStatus = "Gemini 3.7 đang suy nghĩ...";
              });

              _scrollToBottom();

              final models = ["gemini-3.7-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
              bool success = false;
              String lastError = "";

              final contents = currentSession.messages.map((m) => {
                    "role": m.isUser ? "user" : "model",
                    "parts": [{"text": m.text}]
                  }).toList();

              for (String model in models) {
                if (success) break;

                for (int attempt = 1; attempt <= 2; attempt++) {
                  try {
                    if (attempt > 1 || model != models.first) {
                      setState(() {
                        _loadingStatus = "Đang kết nối lại ($model)...";
                      });
                    }

                    final url = Uri.parse(
                        "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$_apiKey");

                    final response = await http.post(
                      url,
                      headers: {"Content-Type": "application/json"},
                      body: jsonEncode({"contents": contents}),
                    );

                    if (response.statusCode == 200) {
                      final data = jsonDecode(response.body);
                      final reply = data['candidates'][0]['content']['parts'][0]['text'];
                      setState(() {
                        currentSession.messages.add(ChatMessage(text: reply, isUser: false));
                      });
                      success = true;
                      break;
                    } else if (response.statusCode == 503 || response.statusCode == 429) {
                      // Máy chủ Google bận -> Tự chờ 1.2 giây rồi thử lại
                      await Future.delayed(const Duration(milliseconds: 1200));
                    } else {
                      final err = jsonDecode(response.body);
                      lastError = err['error']?['message'] ?? 'Lỗi API';
                      break;
                    }
                  } catch (e) {
                    lastError = e.toString();
                    await Future.delayed(const Duration(milliseconds: 1000));
                  }
                }
              }

              if (!success) {
                setState(() {
                  currentSession.messages.add(ChatMessage(
                      text: "❌ Không thể kết nối sau nhiều lần thử: $lastError",
                      isUser: false));
                });
              }

              setState(() {
                _isLoading = false;
              });
              _saveData();
              _scrollToBottom();
            }

            void _scrollToBottom() {
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (_scrollCtrl.hasClients) {
                  _scrollCtrl.animateTo(
                    _scrollCtrl.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 300),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              final currentSession = _sessions[_currentSessionIdx];

              return Scaffold(
                drawer: _buildDrawer(),
                body: Container(
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: _gradients[_gradientIdx],
                    ),
                  ),
                  child: SafeArea(
                    child: Column(
                      children: [
                        // Header Kính Mờ Gọn Gàng
                        Container(
                          height: 52,
                          margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                          child: _buildGlass(
                            borderRadius: 14,
                            padding: const EdgeInsets.symmetric(horizontal: 6),
                            child: Row(
                              children: [
                                Builder(
                                  builder: (ctx) => IconButton(
                                    icon: const Icon(Icons.menu_rounded, color: Colors.white),
                                    onPressed: () => Scaffold.of(ctx).openDrawer(),
                                  ),
                                ),
                                Expanded(
                                  child: Text(
                                    currentSession.title,
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    textAlign: TextAlign.center,
                                    style: const TextStyle(
                                        color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                  ),
                                ),
                                IconButton(
                                  icon: const Icon(Icons.palette_outlined, color: Colors.cyanAccent),
                                  onPressed: _showGradientPicker,
                                ),
                              ],
                            ),
                          ),
                        ),

                        // Khung Chat
                        Expanded(
                          child: currentSession.messages.isEmpty
                              ? Center(
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Container(
                                        padding: const EdgeInsets.all(16),
                                        decoration: BoxDecoration(
                                          shape: BoxShape.circle,
                                          color: Colors.white.withOpacity(0.06),
                                        ),
                                        child: const Icon(Icons.auto_awesome, size: 46, color: Colors.cyanAccent),
                                      ),
                                      const SizedBox(height: 12),
                                      const Text(
                                        "Gemini 3.7 Flash Native\nTôi có thể giúp gì cho bạn hôm nay?",
                                        textAlign: TextAlign.center,
                                        style: TextStyle(color: Colors.white70, fontSize: 15),
                                      ),
                                    ],
                                  ),
                                )
                              : ListView.builder(
                                  controller: _scrollCtrl,
                                  padding: const EdgeInsets.all(12),
                                  itemCount: currentSession.messages.length,
                                  itemBuilder: (ctx, i) {
                                    final msg = currentSession.messages[i];
                                    return Align(
                                      alignment: msg.isUser ? Alignment.centerRight : Alignment.centerLeft,
                                      child: Container(
                                        margin: const EdgeInsets.only(bottom: 12),
                                        constraints: BoxConstraints(
                                          maxWidth: MediaQuery.of(context).size.width * 0.85,
                                        ),
                                        child: _buildGlass(
                                          color: msg.isUser
                                              ? Colors.blueAccent.withOpacity(0.35)
                                              : Colors.black.withOpacity(0.35),
                                          borderRadius: 18,
                                          padding: const EdgeInsets.all(14),
                                          child: SelectableText(
                                            msg.text,
                                            style: const TextStyle(color: Colors.white, fontSize: 15, height: 1.35),
                                          ),
                                        ),
                                      ),
                                    );
                                  },
                                ),
                        ),

                        if (_isLoading)
                          Padding(
                            padding: const EdgeInsets.all(8.0),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                const SizedBox(width: 14, height: 14, child: CircularProgressIndicator(strokeWidth: 2, color: Colors.cyanAccent)),
                                const SizedBox(width: 8),
                                Text(_loadingStatus, style: const TextStyle(color: Colors.cyanAccent, fontSize: 12)),
                              ],
                            ),
                          ),

                        // Thanh Nhập Liệu
                        Padding(
                          padding: const EdgeInsets.fromLTRB(12, 4, 12, 10),
                          child: _buildGlass(
                            borderRadius: 26,
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 2),
                            child: Row(
                              children: [
                                Expanded(
                                  child: TextField(
                                    controller: _textCtrl,
                                    style: const TextStyle(color: Colors.white),
                                    maxLines: null,
                                    decoration: const InputDecoration(
                                      hintText: "Hỏi Gemini 3.7 Flash...",
                                      hintStyle: TextStyle(color: Colors.white38),
                                      border: InputBorder.none,
                                    ),
                                  ),
                                ),
                                IconButton(
                                  icon: const Icon(Icons.send_rounded, color: Colors.cyanAccent),
                                  onPressed: _sendMessage,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildDrawer() {
              return Drawer(
                backgroundColor: Colors.transparent,
                child: _buildGlass(
                  borderRadius: 0,
                  color: Colors.black.withOpacity(0.85),
                  child: SafeArea(
                    child: Column(
                      children: [
                        ListTile(
                          leading: const Icon(Icons.add, color: Colors.cyanAccent),
                          title: const Text("Đoạn chat mới", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                          onTap: () {
                            setState(() {
                              _sessions.insert(0, ChatSession(title: "Đoạn chat mới", messages: []));
                              _currentSessionIdx = 0;
                            });
                            _saveData();
                            Navigator.pop(context);
                          },
                        ),
                        const Divider(color: Colors.white24),
                        Expanded(
                          child: ListView.builder(
                            itemCount: _sessions.length,
                            itemBuilder: (ctx, i) => ListTile(
                              leading: const Icon(Icons.chat_bubble_outline, color: Colors.white60, size: 18),
                              title: Text(
                                _sessions[i].title,
                                maxLines: 1,
                                style: TextStyle(
                                  color: i == _currentSessionIdx ? Colors.cyanAccent : Colors.white,
                                ),
                              ),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete_outline, color: Colors.white38, size: 18),
                                onPressed: () {
                                  setState(() {
                                    _sessions.removeAt(i);
                                    if (_sessions.isEmpty) {
                                      _sessions.add(ChatSession(title: "Đoạn chat mới", messages: []));
                                    }
                                    _currentSessionIdx = 0;
                                  });
                                  _saveData();
                                },
                              ),
                              onTap: () {
                                setState(() {
                                  _currentSessionIdx = i;
                                });
                                Navigator.pop(context);
                              },
                            ),
                          ),
                        ),
                        const Divider(color: Colors.white24),
                        ListTile(
                          leading: const Icon(Icons.key, color: Colors.amberAccent),
                          title: const Text("Cài đặt API Key", style: TextStyle(color: Colors.white)),
                          subtitle: Text(
                            _apiKey.isNotEmpty ? "Đã cấu hình Key" : "Chưa có API Key",
                            style: const TextStyle(color: Colors.white38, fontSize: 12),
                          ),
                          onTap: () {
                            Navigator.pop(context);
                            _showApiKeyDialog();
                          },
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _showApiKeyDialog() {
              final ctrl = TextEditingController(text: _apiKey);
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E202A),
                  title: const Text("Google AI Studio Key", style: TextStyle(color: Colors.white)),
                  content: TextField(
                    controller: ctrl,
                    style: const TextStyle(color: Colors.cyanAccent),
                    decoration: const InputDecoration(
                      hintText: "Dán API Key vào đây...",
                      hintStyle: TextStyle(color: Colors.white30),
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Hủy")),
                    ElevatedButton(
                      onPressed: () {
                        setState(() {
                          _apiKey = ctrl.text.trim();
                        });
                        _saveData();
                        Navigator.pop(ctx);
                      },
                      child: const Text("Lưu Key"),
                    ),
                  ],
                ),
              );
            }

            void _showGradientPicker() {
              showModalBottomSheet(
                context: context,
                backgroundColor: Colors.transparent,
                builder: (ctx) => _buildGlass(
                  borderRadius: 24,
                  color: Colors.black.withOpacity(0.92),
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text("Chọn dải màu loang", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      SizedBox(
                        height: 70,
                        child: ListView.separated(
                          scrollDirection: Axis.horizontal,
                          itemCount: _gradients.length,
                          separatorBuilder: (_, __) => const SizedBox(width: 12),
                          itemBuilder: (ctx, i) => GestureDetector(
                            onTap: () {
                              setState(() {
                                _gradientIdx = i;
                              });
                              _saveData();
                              Navigator.pop(context);
                            },
                            child: Container(
                              width: 60,
                              height: 60,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: LinearGradient(colors: _gradients[i]),
                                border: Border.all(
                                  color: _gradientIdx == i ? Colors.cyanAccent : Colors.white24,
                                  width: 2.5,
                                ),
                              ),
                            ),
                          ),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }

            Widget _buildGlass({required Widget child, double borderRadius = 16, EdgeInsetsGeometry? padding, Color? color}) {
              return ClipRRect(
                borderRadius: BorderRadius.circular(borderRadius),
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: 16, sigmaY: 16),
                  child: Container(
                    padding: padding,
                    decoration: BoxDecoration(
                      color: color ?? Colors.white.withOpacity(0.08),
                      borderRadius: BorderRadius.circular(borderRadius)
